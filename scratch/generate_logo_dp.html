<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 800px;
    height: 800px;
    background: #061325;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .text-title {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 36px;
    display: flex;
    align-items: center;
  }
  .pie-gradient {
    background: linear-gradient(to right, #00f2fe, #0066ff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(0, 242, 254, 0.4));
  }
  .chem-white {
    color: #ffffff;
    margin-left: 6px;
  }
  .sub-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 12px;
    color: rgba(0, 242, 254, 0.8);
    text-transform: uppercase;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <div class="logo-container">
    <svg width="340" height="340" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f2fe" />
          <stop offset="50%" stop-color="#0066ff" />
          <stop offset="100%" stop-color="#7b2cbf" />
        </linearGradient>
        <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3a7bd5" />
          <stop offset="100%" stop-color="#00d2ff" />
        </linearGradient>
        <radialGradient id="glowAccent" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00c6ff" flood-opacity="0.5"/>
        </filter>
      </defs>

      <!-- Outer Hexagon -->
      <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#hexGrad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#shadow)"/>
      
      <!-- Inner Shield -->
      <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="#081b33" fill-opacity="0.9" stroke="url(#hexGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Node Circles -->
      <circle cx="50" cy="6" r="3.5" fill="#00f2fe" />
      <circle cx="88" cy="28" r="3.5" fill="#0066ff" />
      <circle cx="88" cy="72" r="3.5" fill="#7b2cbf" />
      <circle cx="50" cy="94" r="3.5" fill="#00f2fe" />
      <circle cx="12" cy="72" r="3.5" fill="#0066ff" />
      <circle cx="12" cy="28" r="3.5" fill="#7b2cbf" />

      <!-- Pie Core -->
      <path d="M50 50 L50 24 A26 26 0 1 1 24 50 Z" fill="url(#coreGrad)" opacity="0.95"/>
      <path d="M54 46 L76 46 A26 26 0 0 0 54 24 Z" fill="#00f2fe"/>

      <!-- Core Orbit -->
      <circle cx="50" cy="50" r="5" fill="#ffffff" />
      <circle cx="50" cy="50" r="11" fill="url(#glowAccent)" />

      <!-- Electron Ring -->
      <ellipse cx="50" cy="50" rx="31" ry="13" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="4 3" transform="rotate(-30 50 50)" opacity="0.85"/>
    </svg>

    <div class="text-title">
      <span class="pie-gradient">PIE</span>
      <span class="chem-white">CHEM</span>
    </div>
    <div class="sub-text">EXAM PLATFORM</div>
  </div>
</body>
</html>
